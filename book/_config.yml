title: Descenso del gradiente
author: Material didáctico para Administración de Empresas
copyright: "2026"

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/cero1979/DescensoGrad
  branch: main
  path_to_book: book

html:
  favicon: ""
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true
  extra_footer: >
    Material didáctico sobre descenso del gradiente.

sphinx:
  local_extensions:
    dedupe_mathjax: _ext
  config:
    html_show_copyright: false
    html_last_updated_fmt: "%d de %B de %Y"
    language: es
    # MathJax is served from the site itself so the formulas keep working when
    # the jsDelivr CDN is slow, blocked by an extension or unavailable offline.
    # The SVG bundle needs no extra font files.
    mathjax_path: mathjax/tex-mml-svg.js
    myst_enable_extensions:
      - dollarmath
      - amsmath
      - colon_fence
